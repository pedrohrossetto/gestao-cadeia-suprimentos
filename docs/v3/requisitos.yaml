convencoes:
- Este documento apresenta e organiza o conjunto completo de requisitos levantados para o sistema de gestão da cadeia
  de suprimentos, servindo de referência para as etapas de projeto, desenvolvimento, testes e validação.
- 'IDs com ponto (ex.: RF-08.1) são subitens de um requisito dividido para manter cada item atômico; uma referência
  a RF-02 vale para todos os RF-02.x.'
- 'A prioridade indica o estágio de entrega: Demo (apresentação de demonstração ao cliente), Piloto (MVP em operação
  com o primeiro cliente) e Pós-piloto (evolução após o piloto). Um requisito nunca depende de outro de estágio
  posterior.'
- As decisões de arquitetura que motivaram requisitos desta versão estão em docs/adr/ (ADR-001 a ADR-007). O Apêndice
  C lista as alterações em relação à versão 2.0.
mini_mundo:
  descricao:
  - 'O sistema atua na cadeia de suprimentos de grãos: produtores rurais (fornecedores) entregam a produção de suas
    propriedades a armazéns, tradings e indústrias, que a agrupam em lotes, misturam e transformam antes de entregá-la
    a compradores.'
  - Compradores e a regulação socioambiental exigem comprovar que os grãos não vêm de propriedades com desmatamento.
  - Uma mesma instalação do sistema atende várias empresas clientes (armazéns, tradings e indústrias), com os dados
    de cada uma isolados das demais. Dados públicos de referência (listas de embargo, lista suja e SICAR) são compartilhados
    entre as empresas.
  - Empresas que já usam um ERP para estoque, balança, produção e faturamento podem importar dele essas movimentações;
    o sistema é a referência para a origem, a conformidade e os passaportes dos lotes (ADR-008).
  atores:
  - Administrador
  - Analista de Conformidade
  - Operador de Lotes
  - Auditor
  atores_texto: 'Atores: Administrador, Analista de Conformidade, Operador de Lotes e Auditor (somente leitura).
    No estágio Demo, os perfis são simplificados a Administrador e Usuário (RF-14.3).'
  entidades:
  - empresa
  - fornecedor
  - propriedade
  - lote
  - mistura e transformação
  - participação de origem
  - passaporte digital
  - critério de conformidade
  - status de conformidade
  - perfil de validação
  - unidade de armazenagem
  - produto
  - comprador
  - venda
  entidades_texto: 'Entidades principais: empresa, fornecedor, propriedade, lote, mistura e transformação, participação
    de origem, passaporte digital, critério de conformidade, status de conformidade, perfil de validação, unidade
    de armazenagem, produto, comprador e venda.'
proposito: Rastrear os grãos desde as propriedades de origem até o destino final, avaliar a conformidade socioambiental
  de fornecedores, propriedades e lotes por critério e por balanço de massa, registrar cada etapa em passaporte
  digital, com trilha de auditoria. Espera-se reduzir o esforço manual de verificação e permitir comprovar a origem
  de cada lote.
glossario:
- termo: Produtor / fornecedor
  definicao: Pessoa física ou jurídica (CPF/CNPJ) que fornece grãos. No sistema, "fornecedor" é o cadastro do produtor.
- termo: Propriedade
  definicao: Imóvel rural de um fornecedor, com localização e geometria.
- termo: Região
  definicao: Divisão administrativa (município ou UF) derivada da localização da propriedade.
- termo: Área
  definicao: Agrupamento de propriedades definido pelo usuário (RF-01.5).
- termo: Critério de conformidade
  definicao: Verificação do catálogo, composta por nome, nível de aplicação (propriedade ou fornecedor), tipo de
    avaliação com seus parâmetros, fonte de dados, indicação de se é bloqueante e se é eliminatório, e versão. Pode
    ser do sistema (protegido, só a equipe técnica altera) ou do usuário (criado e editado por Analista de Conformidade
    ou superior). Cada critério é avaliado de forma independente dos demais.
- termo: Tipo de avaliação
  definicao: 'Modelo de regra oferecido pelo sistema, parametrizável sem programação: consulta em lista por chave
    (CPF/CNPJ ou geometria), mapa de valores de um campo (ex.: situação do CAR), limiar numérico sobre um campo
    cadastral e sobreposição geométrica com uma camada. Um critério é uma instância de um tipo, com seus parâmetros.'
- termo: Status de conformidade (propriedade ou fornecedor)
  definicao: 'Resultado da avaliação de um critério sobre a entidade: conforme, inconforme, não definido (sem avaliação
    ou sem dado) ou não aplicável (o critério não se aplica à entidade). Cada status guarda a data de avaliação.
    Não existe status único da entidade, apenas um status por critério.'
- termo: Status de conformidade (lote)
  definicao: Para cada critério, a distribuição da massa do lote entre conforme, inconforme e não definido. É derivada
    das participações de origem do lote e do status vigente de cada origem, cada critério considerado no seu nível
    de aplicação; o status não é copiado para o lote. Muda quando o status de uma origem muda e pode ser consultado
    para uma data passada.
- termo: Perfil de validação
  definicao: 'Conjunto de regras definido pelo usuário (RF-06.1); cada regra indica um critério do catálogo e a
    tolerância máxima de massa inconforme e não definida (padrão: 0%). Não existe agregação implícita entre critérios:
    a decisão sim/não sempre se refere ao perfil.'
- termo: Lote validado
  definicao: Lote que atende todas as regras do perfil de validação vigente na data da avaliação (RF-06.2) e cujas
    origens não tiveram status alterado desde então (versão de origem).
- termo: Empresa
  definicao: Cliente do sistema (armazém, trading ou indústria). Cada usuário pertence a uma única empresa, e os
    dados de uma empresa não são visíveis às demais.
- termo: Participação de origem
  definicao: Parcela da massa de um lote, em kg, atribuída a uma propriedade e ao seu fornecedor de origem. É calculada
    por balanço de massa a cada movimentação do lote, levando misturas e transformações até as propriedades de origem.
- termo: Versão de origem
  definicao: Contador de uma propriedade ou fornecedor, incrementado a cada mudança de status em qualquer critério.
    Cada participação de origem guarda a versão usada no seu último cálculo.
- termo: Etapa
  definicao: 'Evento que cria ou modifica um lote: cadastro de entrada, mistura, transformação, transferência ou
    venda.'
- termo: Passaporte digital
  definicao: Registro imutável de uma etapa de um lote, com os dados da etapa, os status de conformidade vigentes
    na data e o hash dos passaportes dos lotes de entrada. O encadeamento dos passaportes reconstitui o histórico
    completo do lote.
- termo: Dado de referência
  definicao: Dado público de fonte externa (listas de embargo, lista suja, SICAR), compartilhado entre as empresas
    e versionado por período de vigência.
- termo: Unidade de armazenagem
  definicao: 'Local físico de uma empresa onde lotes ficam em estoque: um armazém e suas divisões (silos, células
    ou tanques), com capacidade em kg e produtos aceitos (RF-05.9).'
- termo: Produto
  definicao: 'O que um lote contém. Pode ser uma cultura (grão como sai da propriedade, ex.: soja) ou um derivado
    gerado por transformação (ex.: farelo e óleo de soja) (RF-05.11).'
- termo: Quebra
  definicao: Diferença entre a massa esperada de um lote em trânsito e a massa recebida na pesagem de chegada. É
    registrada como saída do lote e não altera a distribuição percentual entre os status (RF-05.10, RN-23).
- termo: Perda de processo
  definicao: Diferença entre a massa de entrada de uma transformação e a soma das massas dos lotes de produto gerados
    (água, impurezas), limitada pelo rendimento do tipo de processo (RN-02).
- termo: Conciliação de massas
  definicao: Comparação periódica entre os saldos de lotes e unidades de armazenagem registrados no ERP da empresa
    e no sistema, com a lista das divergências encontradas (RF-15.3).
