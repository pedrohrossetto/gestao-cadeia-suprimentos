  depende_de:
  - RF-15.2
  requerido_por: []
- id: RN-01
  tipo: regra_de_negocio
  descricao: A soma das quantidades que saem de um lote (transferências, misturas e baixa) não pode ultrapassar
    seu saldo disponível, evitando que a mesma quantidade seja contabilizada duas vezes.
  estagio: Piloto
  depende_de:
  - RF-05.3
  requerido_por: []
- id: RN-02
  tipo: regra_de_negocio
  descricao: Em toda mistura ou transformação, a massa de saída não pode exceder a massa de entrada multiplicada
    pelo rendimento declarado do processo; o rendimento deve estar dentro de limites configuráveis por tipo de processo.
  estagio: Piloto
  depende_de:
  - RF-05.3
  requerido_por: []
- id: RN-03
  tipo: regra_de_negocio
  descricao: 'O grafo de lotes deve ser acíclico direcionado: um lote não pode ser origem de si mesmo, direta ou
    indiretamente.'
  estagio: Piloto
  depende_de:
  - RF-05.2
  requerido_por: []
- id: RN-04
  tipo: regra_de_negocio
  descricao: Todo lote deve ser rastreável até ao menos uma propriedade; lote sem origem identificada fica bloqueado
    para saída até a regularização.
  estagio: Piloto
  depende_de:
  - RF-05.1
  requerido_por: []
- id: RN-05
  tipo: regra_de_negocio
  descricao: 'O status de cada critério de um lote é calculado apenas por balanço de massa: toda massa de saída
    de uma mistura ou transformação mantém a distribuição proporcional de status das massas de entrada. Massa inconforme
    ou não definida não pode se tornar conforme por mistura ou repasse.'
  estagio: Piloto
  depende_de:
  - RF-05.3
  - RF-07.2
  requerido_por: []
- id: RN-06
  tipo: regra_de_negocio
  descricao: Propriedade ou fornecedor com status inconforme em critério marcado como bloqueante não pode ter novos
    lotes de entrada vinculados até a regularização comprovada.
  estagio: Piloto
  depende_de:
  - RF-07.1
  requerido_por: []
- id: RN-07
  tipo: regra_de_negocio
  descricao: O status de cada critério de um integrante de grupo econômico estende-se aos demais integrantes, critério
    a critério, prevalecendo o pior status (inconforme, depois não definido, depois conforme). A extensão não cria
    critério novo.
  estagio: Pós-piloto
  depende_de:
  - RF-04.1
  requerido_por: []
- id: RN-08
  tipo: regra_de_negocio
  descricao: A alteração manual do status de um critério exige justificativa e documento anexo e só pode ser feita
    por usuário com permissão para isso (RF-14.6).
  estagio: Piloto
  depende_de:
  - RF-07.1
  - RF-12.1
  - RF-14.6
  requerido_por: []
- id: RN-09
  tipo: regra_de_negocio
  descricao: Geometrias de propriedades devem ser válidas; sobreposição com propriedade de outro fornecedor acima
    de 5% da área da menor das duas (limite configurável) gera alerta de conflito para análise.
  estagio: Pós-piloto
  depende_de:
  - RF-01.2
  - RF-02.1
  requerido_por: []
- id: RN-10
  tipo: regra_de_negocio
  descricao: No critério Situação do CAR, o status é inconforme se o CAR estiver cancelado, suspenso ou pendente;
    conforme se estiver ativo; não definido se ainda não houve consulta.
  estagio: Demo
  depende_de:
  - RF-03.1
  requerido_por: []
- id: RN-11
  tipo: regra_de_negocio
  descricao: O sistema deve alertar quando o volume recebido de uma propriedade no ano exceder a produtividade máxima
    por hectare da cultura (tabela configurável pelo usuário) multiplicada pela área da propriedade.
  estagio: Pós-piloto
  depende_de:
  - RF-01.2
  - RF-05.1
  requerido_por: []
- id: RN-12
  tipo: regra_de_negocio
  descricao: Uma mesma nota fiscal ou documento de transporte não pode ser vinculado a mais de um lote de entrada.
  estagio: Piloto
  depende_de:
  - RF-05.1
  requerido_por: []
- id: RN-13
  tipo: regra_de_negocio
  descricao: Toda transferência de lote entre fornecedores deve ter documento fiscal anexo e não pode alterar a
    propriedade de origem registrada no lote.
  estagio: Piloto
  depende_de:
  - RF-05.2
  - RF-12.1
  requerido_por: []
- id: RN-14
  tipo: regra_de_negocio
  descricao: Alterações no perfil de validação valem para lotes novos e em estoque, sem alterar retroativamente
    os passaportes já gerados.
  estagio: Pós-piloto
  depende_de:
  - RF-06.1
  - RF-05.5
  requerido_por: []
- id: RN-16
  tipo: regra_de_negocio
  descricao: 'Um status de critério nunca é sobrescrito: cada nova avaliação gera um novo registro, preservando
    os anteriores.'
  estagio: Demo
  depende_de:
  - RF-07.1
  requerido_por: []
- id: RN-17
  tipo: regra_de_negocio
  descricao: Cada critério é avaliado no seu nível de aplicação (propriedade ou fornecedor), de modo que a mesma
    massa não seja contada duas vezes no mesmo critério.
  estagio: Piloto
  depende_de:
  - RF-07.2
  requerido_por: []
- id: RN-18
  tipo: regra_de_negocio
  descricao: 'A massa com status não definido nunca é tratada como conforme: permanece como parcela separada na
    distribuição do lote. Status não aplicável não entra na distribuição.'
  estagio: Piloto
  depende_de:
  - RF-07.2
  requerido_por: []
- id: RN-19
  tipo: regra_de_negocio
  descricao: A venda de um lote só pode ser concluída com o status de conformidade calculado sobre a versão atual
    de cada origem; se alguma origem mudou desde o último cálculo, o status é recalculado antes da operação. Indicadores
    agregados (RNF-21) não podem ser usados nessa decisão.
  estagio: Piloto
  depende_de:
  - RF-07.2
  - RF-13.2
  requerido_por: []
- id: RN-20
  tipo: regra_de_negocio
  descricao: Uma etapa só pode usar como entrada um lote cujo passaporte da etapa anterior já tenha sido gerado.
  estagio: Piloto
  depende_de:
  - RF-05.5
  requerido_por: []
- id: RN-21
  tipo: regra_de_negocio
  descricao: 'O passaporte é uma declaração pontual: registra os status vigentes na data de geração e não muda quando
    o status de uma origem muda depois. O status atual é exibido à parte.'
  estagio: Piloto
  depende_de:
  - RF-05.5
  requerido_por: []
- id: RN-22
  tipo: regra_de_negocio
  descricao: Dados de referência públicos são compartilhados entre as empresas e versionados por período de vigência;
    listas de bloqueio próprias de uma empresa pertencem apenas a ela.
  estagio: Piloto
  depende_de:
  - RNF-12
  - RF-08.1
  requerido_por: []
- id: RN-23
  tipo: regra_de_negocio
  descricao: No recebimento de um lote, a massa recebida não pode ser maior que a esperada; a quebra acima da tolerância
    configurada pela empresa para o produto exige justificativa e fica sinalizada para conferência do Analista de
    Conformidade.
  estagio: Piloto
  depende_de:
  - RF-05.10
  requerido_por: []
- id: RN-24
  tipo: regra_de_negocio
  descricao: Uma movimentação importada do ERP passa pelas mesmas regras de uma registrada no sistema (RN-01, RN-02,
    RN-06, RN-12, RN-20, RN-23); se alguma falhar, ela fica pendente para análise e não é aplicada parcialmente.
  estagio: Pós-piloto
  depende_de:
  - RF-15.2
  requerido_por: []
- id: RN-25
  tipo: regra_de_negocio
  descricao: Em lotes integrados, o ERP é a fonte da massa e do documento fiscal, e o sistema é a fonte das origens,
    dos status e dos passaportes; correções de massa são feitas no ERP e reimportadas.
  estagio: Pós-piloto
  depende_de:
  - RF-15.2
  requerido_por: []
- id: RS-01
  tipo: suplementar
  categoria: Legal (LGPD)
  descricao: Cada categoria de dado pessoal tratada (CPF, parentesco, localização) deve ter finalidade e base legal
    declaradas em registro de tratamento.
  estagio: Piloto
  depende_de:
  - RF-01.1
  - RF-14.1
  requerido_por:
  - RS-02
  - RS-03
  - RS-04
- id: RS-02
  tipo: suplementar
  categoria: Legal (LGPD)
  descricao: O sistema deve coletar apenas os dados pessoais necessários à finalidade declarada (minimização).
  estagio: Piloto
  depende_de:
  - RS-01
  requerido_por: []
- id: RS-03
  tipo: suplementar
  categoria: Legal (LGPD)
  descricao: O sistema deve permitir atender solicitações de titulares (acesso, correção, eliminação ou anonimização)
    em até 15 dias.
  estagio: Piloto
  depende_de:
  - RS-01
  requerido_por: []
- id: RS-04
  tipo: suplementar
  categoria: Legal (LGPD)
  descricao: Os dados do sistema devem ser armazenados e processados em data centers localizados no Brasil.
  estagio: Piloto
  depende_de:
  - RS-01
  requerido_por: []
alteracoes_v2:
- 'Novos: RF-05.6 (participação de origem), RF-05.7 (histórico completo), RF-05.8 (transferência), RF-05.9 (unidades
  de armazenagem), RF-05.10 (recebimento de lote), RF-05.11 (produtos e tipos de processo), RF-07.5 (alteração manual
  de status), RF-14.7 (consulta à trilha de auditoria), RF-14.8 (cadastro de empresas), RF-15.1 a RF-15.3 (integração
  com ERP, ADR-008).'
- 'Novos: RNF-18 (isolamento entre empresas), RNF-19 (massa em kg inteiros), RNF-20 (adaptadores de fontes externas),
  RNF-21 (atualização dos indicadores), RNF-22 (reações a alterações não se perdem), RNF-23 (importação idempotente).'
- 'Novos: RN-19 (venda com status atual), RN-20 (passaporte antes do uso), RN-21 (passaporte como declaração pontual),
  RN-22 (dados de referência compartilhados), RN-23 (quebra no recebimento), RN-24 e RN-25 (movimentações importadas
  do ERP); RS-04 (dados no Brasil).'
- 'Reescritos: RF-05.1, RF-05.2, RF-05.5 (passaporte por etapa, encadeado), RF-07.2 (participação × status), RF-07.3,
  RF-13.2 a RF-13.4 (massa em vez de tonelagem), RF-14.1 (usuários da empresa), RNF-11 (hash dos passaportes, RFC
  8785), RNF-13, RN-14 (preserva passaportes já gerados).'
- 'Removido: RN-15, fora do escopo da v3.'
- 'Estágio: RNF-13 Pós-piloto → Demo; RNF-11 Pós-piloto → Piloto.'
- 'Dependências: RN-06 passa a depender de RF-07.1 (registro do status), não de RF-01.4 (exibição).'
- Requisitos funcionais passam a ter categoria (campo `categoria`) e resumo (campo `resumo`); o grafo de dependências
  foi dividido em um grafo só de funcionais e um grafo completo.
- 'Glossário: novos termos Empresa, Participação de origem, Versão de origem, Etapa, Passaporte digital, Dado de
  referência, Unidade de armazenagem, Produto, Quebra, Perda de processo e Conciliação de massas; revistos Status
  de conformidade (lote) e Lote validado.'
