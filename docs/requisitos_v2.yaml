- id: RN-01
  tipo: regra_de_negocio
  descricao: A soma das quantidades que saem de um lote (transferências, misturas e baixa) não pode ultrapassar
    seu saldo disponível, evitando que a mesma quantidade seja contabilizada duas vezes.
  estagio: Piloto
  depende_de:
  - RF-05.3
  requerido_por: []
- id: RN-02
  tipo: regra_de_negocio
  descricao: Em toda mistura ou transformação, a massa de saída não pode exceder a massa de entrada multiplicada
    pelo rendimento declarado do processo; o rendimento deve estar dentro de limites configuráveis por
    tipo de processo.
  estagio: Piloto
  depende_de:
  - RF-05.3
  requerido_por: []
- id: RN-03
  tipo: regra_de_negocio
  descricao: "O grafo de lotes deve ser acíclico direcionado: um lote não pode ser origem de si mesmo,\
    \ direta ou indiretamente."
  estagio: Piloto
  depende_de:
  - RF-05.2
  requerido_por: []
- id: RN-04
  tipo: regra_de_negocio
  descricao: Todo lote deve ser rastreável até ao menos uma propriedade; lote sem origem identificada
    fica bloqueado para saída até a regularização.
  estagio: Piloto
  depende_de:
  - RF-05.1
  requerido_por: []
- id: RN-05
  tipo: regra_de_negocio
  descricao: "O status de cada critério de um lote é calculado apenas por balanço de massa: toda massa\
    \ de saída de uma mistura ou transformação mantém a distribuição proporcional de status das massas\
    \ de entrada. Massa inconforme ou não definida não pode se tornar conforme por mistura ou repasse."
  estagio: Piloto
  depende_de:
  - RF-05.3
  - RF-07.2
  requerido_por: []
- id: RN-06
  tipo: regra_de_negocio
  descricao: Propriedade ou fornecedor com status inconforme em critério marcado como bloqueante não pode
    ter novos lotes de entrada vinculados até a regularização comprovada.
  estagio: Piloto
  depende_de:
  - RF-01.4
  requerido_por: []
- id: RN-07
  tipo: regra_de_negocio
  descricao: O status de cada critério de um integrante de grupo econômico estende-se aos demais integrantes,
    critério a critério, prevalecendo o pior status (inconforme, depois não definido, depois conforme).
    A extensão não cria critério novo.
  estagio: Pós-piloto
  depende_de:
  - RF-04.1
  requerido_por: []
- id: RN-08
  tipo: regra_de_negocio
  descricao: A alteração manual do status de um critério exige justificativa e documento anexo e só pode
    ser feita por usuário com permissão para isso (RF-14.6).
  estagio: Piloto
  depende_de:
  - RF-07.1
  - RF-12.1
  - RF-14.6
  requerido_por: []
- id: RN-09
  tipo: regra_de_negocio
  descricao: Geometrias de propriedades devem ser válidas; sobreposição com propriedade de outro fornecedor
    acima de 5% da área da menor das duas (limite configurável) gera alerta de conflito para análise.
  estagio: Pós-piloto
  depende_de:
  - RF-01.2
  - RF-02.1
  requerido_por: []
- id: RN-10
  tipo: regra_de_negocio
  descricao: No critério Situação do CAR, o status é inconforme se o CAR estiver cancelado, suspenso ou
    pendente; conforme se estiver ativo; não definido se ainda não houve consulta.
  estagio: Demo
  depende_de:
  - RF-03.1
  requerido_por: []
- id: RN-11
  tipo: regra_de_negocio
  descricao: O sistema deve alertar quando o volume recebido de uma propriedade no ano exceder a produtividade
    máxima por hectare da cultura (tabela configurável pelo usuário) multiplicada pela área da propriedade.
  estagio: Pós-piloto
  depende_de:
  - RF-01.2
  - RF-05.1
  requerido_por: []
- id: RN-12
  tipo: regra_de_negocio
  descricao: Uma mesma nota fiscal ou documento de transporte não pode ser vinculado a mais de um lote
    de entrada.
  estagio: Piloto
  depende_de:
  - RF-05.1
  requerido_por: []
- id: RN-13
  tipo: regra_de_negocio
  descricao: Toda transferência de lote entre fornecedores deve ter documento fiscal anexo e não pode
    alterar a propriedade de origem registrada no lote.
  estagio: Piloto
  depende_de:
  - RF-05.2
  - RF-12.1
  requerido_por: []
- id: RN-14
  tipo: regra_de_negocio
  descricao: Alterações no perfil de validação valem para lotes novos e em estoque, sem alterar retroativamente
    DDS já emitidas.
  estagio: Pós-piloto
  depende_de:
  - RF-06.1
  - RN-15
  requerido_por: []
- id: RN-15
  tipo: regra_de_negocio
  descricao: DDS emitida não pode ser editada nem excluída e preserva o status de conformidade do lote
    vigente na emissão; correções são feitas por retificação ou cancelamento, vinculados à declaração
    original.
  estagio: Pós-piloto
  depende_de: []
  requerido_por:
  - RN-14
- id: RN-16
  tipo: regra_de_negocio
  descricao: "Um status de critério nunca é sobrescrito: cada nova avaliação gera um novo registro, preservando\
    \ os anteriores."
  estagio: Demo
  depende_de:
  - RF-07.1
  requerido_por: []
- id: RN-17
  tipo: regra_de_negocio
  descricao: Cada critério é avaliado no seu nível de aplicação (propriedade ou fornecedor), de modo que
    a mesma massa não seja contada duas vezes no mesmo critério.
  estagio: Piloto
  depende_de:
  - RF-07.2
  requerido_por: []
- id: RN-18
  tipo: regra_de_negocio
  descricao: "A massa com status não definido nunca é tratada como conforme: permanece como parcela separada\
    \ na distribuição do lote. Status não aplicável não entra na distribuição."
  estagio: Piloto
  depende_de:
  - RF-07.2
  requerido_por: []
