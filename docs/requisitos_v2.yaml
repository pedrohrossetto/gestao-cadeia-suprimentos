convencoes:
- Este documento apresenta e organiza o conjunto completo de requisitos levantados para o sistema de gestão
  da cadeia de suprimentos, servindo de referência para as etapas de projeto, desenvolvimento, testes
  e validação.
- "IDs com ponto (ex.: RF-08.1) são subitens de um requisito dividido para manter cada item atômico; uma\
  \ referência a RF-02 vale para todos os RF-02.x."
- "A prioridade indica o estágio de entrega: Demo (apresentação de demonstração ao cliente), Piloto (MVP\
  \ em operação com o primeiro cliente) e Pós-piloto (evolução após o piloto). Um requisito nunca depende\
  \ de outro de estágio posterior."
mini_mundo:
  descricao:
  - "O sistema atua na cadeia de suprimentos de grãos: produtores rurais (fornecedores) entregam a produção\
    \ de suas propriedades a armazéns, tradings e indústrias, que a agrupam em lotes, misturam e transformam\
    \ antes de entregá-la a compradores."
  - Compradores e a regulação socioambiental exigem comprovar que os grãos não vêm de propriedades com
    desmatamento.
  atores:
  - Administrador
  - Analista de Conformidade
  - Operador de Lotes
  - Auditor
  atores_texto: "Atores: Administrador, Analista de Conformidade, Operador de Lotes e Auditor (somente\
    \ leitura)."
  entidades:
  - fornecedor
  - propriedade
  - lote
  - mistura e transformação
  - critério de conformidade
  - status de conformidade
  - perfil de validação
  - Score de Risco ESG
  - DDS
  entidades_texto: "Entidades principais: fornecedor, propriedade, lote, mistura e transformação, critério\
    \ de conformidade, status de conformidade, perfil de validação, Score de Risco ESG e DDS."
proposito: Rastrear os grãos desde as propriedades de origem até o destino final, avaliar a conformidade
  socioambiental de fornecedores, propriedades e lotes por critério e por balanço de massa, calcular o
  risco ESG e emitir a DDS ao comprador, com trilha de auditoria. Espera-se reduzir o esforço manual de
  verificação e permitir comprovar a origem de cada lote.
glossario:
- termo: Produtor / fornecedor
  definicao: Pessoa física ou jurídica (CPF/CNPJ) que fornece grãos. No sistema, "fornecedor" é o cadastro
    do produtor.
- termo: Propriedade
  definicao: Imóvel rural de um fornecedor, com localização e geometria.
- termo: Região
  definicao: Divisão administrativa (município ou UF) derivada da localização da propriedade.
- termo: Área
  definicao: Agrupamento de propriedades definido pelo usuário (RF-01.5).
- termo: Critério de conformidade
  definicao: Verificação do catálogo, composta por nome, nível de aplicação (propriedade ou fornecedor),
    tipo de avaliação com seus parâmetros, fonte de dados, indicação de se é bloqueante e se é eliminatório,
    e versão. Pode ser do sistema (protegido, só a equipe técnica altera) ou do usuário (criado e editado
    por Analista de Conformidade ou superior). Cada critério é avaliado de forma independente dos demais.
- termo: Tipo de avaliação
  definicao: "Modelo de regra oferecido pelo sistema, parametrizável sem programação: consulta em lista\
    \ por chave (CPF/CNPJ ou geometria), mapa de valores de um campo (ex.: situação do CAR), limiar numérico\
    \ sobre um campo cadastral e sobreposição geométrica com uma camada. Um critério é uma instância de\
    \ um tipo, com seus parâmetros."
- termo: Status de conformidade (propriedade ou fornecedor)
  definicao: "Resultado da avaliação de um critério sobre a entidade: conforme, inconforme, não definido\
    \ (sem avaliação ou sem dado) ou não aplicável (o critério não se aplica à entidade). Cada status\
    \ guarda a data de avaliação. Não existe status único da entidade, apenas um status por critério."
- termo: Status de conformidade (lote)
  definicao: Para cada critério, a distribuição da massa do lote entre conforme, inconforme e não definido,
    calculada por balanço de massa a partir do status das propriedades e fornecedores de origem, cada
    critério considerado no seu nível de aplicação. É recalculado quando o status de uma origem muda e
    pode ser consultado para uma data passada.
- termo: Perfil de validação
  definicao: "Conjunto de regras definido pelo usuário (RF-06.1); cada regra indica um critério do catálogo\
    \ e a tolerância máxima de massa inconforme e não definida (padrão: 0%). Não existe agregação implícita\
    \ entre critérios: a decisão sim/não sempre se refere ao perfil."
- termo: Lote validado
  definicao: Lote que atende todas as regras do perfil de validação vigente na data da avaliação (RF-06.2)
    e não sofreu alteração de origem desde então.
- termo: Score de Risco ESG
  definicao: Valor de 0 a 100, em que 0 é o menor risco e 100 o maior.
